[project]
name = "ankyra"
version = "0.1.0"
description = "Hybrid neuro-symbolic reasoning engine"
authors = [{ name = "Vladimir Lapshin", email = "mefrill@yandex.ru" }]
requires-python = ">=3.11"
dependencies = [
    "dynaconf>=3.3.3",
    "langchain-core>=0.3.0",
    "langchain-openai>=0.3.0",
    "langgraph>=0.2.0",
    "pydantic>=2.10.0",
    "python-dotenv>=1.0.0",
]

[build-system]
requires = ["uv_build>=0.10.2,<0.11.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.0",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
asyncio_mode = "auto"
markers = [
    "live: calls an external LLM (set ANKYRA_LIVE=1)",
]

[tool.uv.build-backend]
module-name = "ankyra"
module-root = "src"
